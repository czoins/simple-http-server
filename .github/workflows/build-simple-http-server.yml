      - name: Patch src/main.rs (swap hyper-native-tls for the OpenSSL acceptor)
        shell: bash
        run: |
          git apply --verbose <<'EOF_MAIN_PATCH'
          diff --git a/src/main.rs b/src/main.rs
          index 2e1a35d..1ab4bb0 100755
          --- a/src/main.rs
