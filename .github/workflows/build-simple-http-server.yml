# GitHub Actions workflow: build simple-http-server for Windows with
# working OpenSSL-based TLS - no Rust toolchain needed on your machine.
#
# v2 - fixes the first runner attempt (2026-11-23):
#   1. Build now puts the image's FULL Perl (Strawberry) first on PATH.
#      Git Bash's bundled Perl lacks core modules (Locale::Maketext::Simple)
#      and made openssl-src's `perl Configure` die with exit code 2 ->
#      "error: failed to run custom build command for openssl-sys" (the
#      only real error in that run; everything before it worked).
#   2. Smoke tests rewritten in PowerShell with Windows-native tools
#      (New-SelfSignedCertificate + Export-PfxCertificate + curl.exe):
#      no dependency on Git Bash's openssl/curl anymore.
#
# WEB-ONLY USAGE (no CLI, no local build tools):
#   1. Fork https://github.com/thewawar/simple-http-server (button, top right).
#   2. In YOUR fork (github.com/<you>/simple-http-server):
#      "Add file" -> "Create new file" ->
#      name it:  .github/workflows/build-simple-http-server.yml
#      paste this whole file as the content -> "Commit changes".
#      (If you already added the v1 file: open it in your fork, click the
#      pencil icon, select all, paste this file's content, commit.)
#   3. Open the "Actions" tab of your fork -> click
#      "I understand my workflows, go ahead and enable them".
#   4. Left sidebar: "Build simple-http-server (Windows, TLS via OpenSSL)"
#      -> "Run workflow" button -> "Run workflow" (branch: main / master).
#   5. Wait ~10-15 min for the green check. Open that run ->
#      scroll to "Artifacts" at the bottom -> download both zips.
#      Each zip contains the .exe plus a short USAGE.txt.
#
# What you get (Windows x64, both with OpenSSL TLS instead of Schannel):
#   - v0.8.0  built from upstream source with `--features tls`
#             (no source changes; TLS 1.2/1.3; same --cert/--certpass CLI)
#   - v0.6.1  upstream source with a surgical patch: the 2021-era
#             hyper-native-tls/Schannel server path is replaced by an
#             OpenSSL acceptor (identical CLI, identical p12 handling).
#             This is the build to use if you liked 0.6.1's behavior.
#
# The v0.6.1 patch embedded below is exactly the tree that was compiled and
# runtime-validated end-to-end (TLS 1.3 + HTTP 200 with a two-password
# PKCS#12, full chain served, SAN mismatch correctly rejected).
#
# Build-time notes: OPENSSL_NO_ASM=1 keeps the vendored OpenSSL build free
# of the NASM requirement; rustc may print bare-trait-object warnings from
# a vendored 2015-era helper crate - warnings only, they do not fail the
# build (verified on rustc 1.100.0 in the first runner attempt).

name: Build simple-http-server (Windows, TLS via OpenSSL)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v080-tls:
    name: v0.8.0 + tls feature (upstream, vendored OpenSSL)
    runs-on: windows-latest
    env:
      RUSTUP_TOOLCHAIN: stable
      # Build vendored OpenSSL without assembly: removes the NASM
      # requirement, works on any Windows runner image.
      OPENSSL_NO_ASM: '1'
    steps:
      - name: Check out tag v0.8.0
        uses: actions/checkout@v4
        with:
          ref: v0.8.0

      - name: Ensure stable Rust toolchain
        shell: bash
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Build (with a full Perl on PATH for the vendored OpenSSL)
        shell: bash
        run: |
          # --- make a full Perl visible for the vendored OpenSSL build -------------
          # Git Bash's bundled Perl lacks core modules (Locale::Maketext::Simple etc.)
          # which makes openssl-src's `perl Configure` die with exit code 2.
          for d in /c/Strawberry/perl/bin /c/Strawberry /c/tools/perl/bin /c/Perl64/bin /c/Perl/bin; do
            if [ -x "$d/perl.exe" ] && "$d/perl.exe" -MLocale::Maketext::Simple -e 'exit 0' >/dev/null 2>&1; then
              echo "Using full Perl from: $d"
              export PATH="$d:$PATH"
              break
            fi
          done
          if ! perl -MLocale::Maketext::Simple -e 'print "ok\n"' >/dev/null 2>&1; then
            echo 'No usable Perl found on the image; installing Strawberry Perl via chocolatey...'
            choco install -y strawberryperl --no-progress
            export PATH="/c/Strawberry/perl/bin:$PATH"
          fi
          perl -MLocale::Maketext::Simple -e 'print "perl ready for vendored OpenSSL\n"' \
            || { echo '::error::no full Perl available - vendored OpenSSL cannot be configured'; exit 1; }
          # ---------------------------------------------------------------------------
          cargo build --release --features tls

      - name: Smoke test (serve HTTPS with a throwaway self-signed p12)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $p12 = Join-Path $env:RUNNER_TEMP 'smoke.p12'
          $cert = New-SelfSignedCertificate -Subject 'CN=localhost' -KeyExportPolicy Exportable -CertStoreLocation 'Cert:\CurrentUser\My' -NotAfter (Get-Date).AddDays(2)
          $pw = ConvertTo-SecureString 'test1234' -AsPlainText -Force
          Export-PfxCertificate -Cert $cert -FilePath $p12 -Password $pw | Out-Null
          $exe = Join-Path (Get-Location) 'target\release\simple-http-server.exe'
          $out = Join-Path $env:RUNNER_TEMP 'smoke-server.log'
          $p = Start-Process -FilePath $exe -ArgumentList @('--cert', $p12, '--certpass', 'test1234', '--ip', '127.0.0.1', '--port', '8443', '.') -PassThru -NoNewWindow -RedirectStandardOutput $out
          try {
            $code = ''
            for ($i = 0; $i -lt 10 -and $code -ne '200'; $i++) {
              Start-Sleep -Seconds 1
              $code = (& curl.exe -k -s -o NUL -w '%{http_code}' https://127.0.0.1:8443/ 2>$null)
            }
            Write-Host "HTTPS smoke test HTTP status: $code"
            if ($code -ne '200') {
              Write-Host '--- server output so far:'
              Get-Content $out -ErrorAction SilentlyContinue
              throw "smoke test failed (status $code)"
            }
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)" -ErrorAction SilentlyContinue
          }
          Write-Host 'Smoke test PASSED: the exe serves HTTPS.'

      - name: Write usage note
        shell: bash
        run: |
          cat > USAGE.txt <<'EOF_USAGE'
          simple-http-server v0.8.0 - TLS build (upstream, --features tls)
          ================================================================

          Upstream v0.8.0 source, built with the `tls` feature, which statically links
          OpenSSL on Windows (Schannel is not involved). No source modifications.

          Usage is upstream v0.8.0's; certificates are still PKCS#12:

              simple-http-server.exe --cert local.p12 --certpass <export-password> --ip 0.0.0.0 --port 8001 <root-dir>

          Notes:
          - --certpass takes the PKCS#12 EXPORT password.
          - Downloaded exes may be flagged by SmartScreen (unsigned build): right-click
            -> Properties -> Unblock, or "More info" -> "Run anyway" when running.
          EOF_USAGE

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: simple-http-server-v0.8.0-tls-windows-x64
          path: |
            target/release/simple-http-server.exe
            USAGE.txt
          if-no-files-found: error

  v061-openssl:
    name: v0.6.1 patched to OpenSSL TLS (replaces Schannel)
    runs-on: windows-latest
    env:
      # The v0.6.1 tag pins rust-toolchain to 1.42.0 (too old for modern
      # crates.io); force the modern stable toolchain instead.
      RUSTUP_TOOLCHAIN: stable
      OPENSSL_NO_ASM: '1'
    steps:
      - name: Check out tag v0.6.1
        uses: actions/checkout@v4
        with:
          ref: v0.6.1

      - name: Ensure stable Rust toolchain
        shell: bash
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Normalize line endings to LF (so the patch applies cleanly)
        shell: bash
        run: |
          git config core.autocrlf false
          git rm --cached -r -q .
          git reset --hard -q

      - name: Overlay patched files (Cargo.toml, src/tls.rs, vendored traitobject, Cargo.lock)
        shell: bash
        run: |
          mkdir -p vendor/traitobject/src
          cat > Cargo.toml <<'EOF_CARGO_TOML'
          [package]
          name = "simple-http-server"
          version = "0.6.1"
          authors = ["thewawar <thewawar@gmail.com>"]
          license = "MIT"
          description = "Simple HTTP server"
          readme = "README.md"
          keywords = ["simple", "http", "server", "static", "file"]
          repository = "https://github.com/TheWaWaR/simple-http-server"
          edition = "2018"

          [dependencies]
          clap = "2.33.0"
          termcolor = "1.0.5"
          lazy_static = "1.4.0"
          time = "0.1.42"
          chrono = "0.4.9"
          flate2 = "1.0.11"
          filetime = "0.2.7"
          pretty-bytes = "0.2.2"
          url = "2.1.0"
          # TLS backend: OpenSSL on every platform (replaces hyper-native-tls, which
          # used the platform's native TLS = Schannel on Windows and is what caused
          # the per-connection resets on hardened Windows machines).
          openssl = { version = "0.10", optional = true }
          mime_guess = "2.0"
          open = "1"
          # Iron crates
          iron = "0.6.1"
          # Direct dep: src/tls.rs implements hyper's SslServer/NetworkStream traits
          # (same version iron 0.6.1 uses, so it unifies with the existing one).
          hyper = "0.10.16"
          iron-cors = "0.8.0"
          multipart = { version = "0.16.1", features = ["iron"] }
          htmlescape = "0.3.1"
          percent-encoding = "2.1.0"
          path-dedot = "1"

          [target.'cfg(windows)'.dependencies]
          # Vendored = static OpenSSL compiled into the exe by the openssl crate
          # (needs only Perl on the build machine; set OPENSSL_NO_ASM=1 to also skip
          # the NASM requirement). Identical to how upstream v0.8.0 does its Windows
          # TLS builds.
          openssl = { version = "0.10", optional = true, features = ["vendored"] }

          [features]
          default = ["tls"]
          tls = ["dep:openssl"]

          [patch.crates-io]
          # 2015-era crate pulled in via iron -> plugin -> typemap; its impls.rs breaks
          # on modern rustc (trait-object bounds are now deduplicated, E0119). Vendored
          # copy with the duplicated marker impls removed - see vendor/traitobject/.
          traitobject = { path = "vendor/traitobject" }
          EOF_CARGO_TOML
          cat > src/tls.rs <<'EOF_TLS_RS'
          //! TLS (HTTPS) support for hyper 0.10 via the `openssl` crate.
          //!
          //! Drop-in replacement for the `hyper-native-tls` server wrapper that
          //! simple-http-server v0.6.1 originally used. The CLI is unchanged
          //! (`--cert <file.p12> --certpass <password>`; the p12's *export* password,
          //! as before), but the TLS engine is OpenSSL on every platform instead of
          //! the platform's native TLS. On Windows that means Schannel is bypassed
          //! entirely - relevant on machines where Schannel's server-side policy
          //! (e.g. cipher-suite restrictions under
          //! `HKLM\SOFTWARE\Policies\Microsoft\Cryptography\Configuration\SSL\00010002`)
          //! rejects everything the old SCHANNEL_CRED-based code could negotiate,
          //! which surfaces as an instant connection reset for every client.
          //!
          //! Mirrors the structure of hyper-native-tls 0.3.0 (same `SslServer`
          //! plumbing, same Arc<Mutex> stream shape required by hyper 0.10's
          //! `SslServer::Stream: NetworkStream + Send + Clone` bound), so the
          //! integration with iron's `Iron::https()` is unchanged.

          use std::error::Error as StdError;
          use std::fmt;
          use std::fs::File;
          use std::io::{self, Read, Write};
          use std::net::SocketAddr;
          use std::path::Path;
          use std::sync::{Arc, Mutex, MutexGuard};
          use std::time::Duration;

          use hyper::net::NetworkStream;
          use openssl::pkcs12::Pkcs12;
          use openssl::ssl::{SslAcceptor, SslMethod, SslStream, SslVersion};

          /// A hyper `NetworkStream` backed by an OpenSSL `SslStream`.
          ///
          /// `Clone` + interior mutability are required by hyper 0.10's
          /// `SslServer::Stream` bound; `Arc<Mutex<..>>` is the same shape
          /// hyper-native-tls used for its stream type.
          pub struct TlsStream<S>(Arc<Mutex<SslStream<S>>>);

          impl<S> Clone for TlsStream<S> {
              fn clone(&self) -> Self {
                  TlsStream(Arc::clone(&self.0))
              }
          }

          impl<S> fmt::Debug for TlsStream<S> {
              fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
                  f.write_str("TlsStream")
              }
          }

          fn lock<S>(m: &Mutex<S>) -> MutexGuard<'_, S> {
              // A poisoned mutex only means the previous holder panicked (e.g. a
              // client that disappeared mid-read); the stream itself is still
              // usable enough for the next lock holder to finish or shut down.
              m.lock().unwrap_or_else(|e| e.into_inner())
          }

          impl<S: Read + Write> Read for TlsStream<S> {
              fn read(&mut self, buf: &mut [u8]) -> io::Result<usize> {
                  lock(&self.0).read(buf)
              }
          }

          impl<S: Read + Write> Write for TlsStream<S> {
              fn write(&mut self, buf: &[u8]) -> io::Result<usize> {
                  lock(&self.0).write(buf)
              }

              fn flush(&mut self) -> io::Result<()> {
                  lock(&self.0).flush()
              }
          }

          impl<S: NetworkStream> NetworkStream for TlsStream<S> {
              fn peer_addr(&mut self) -> io::Result<SocketAddr> {
                  lock(&self.0).get_mut().peer_addr()
              }

              fn set_read_timeout(&self, dur: Option<Duration>) -> io::Result<()> {
                  lock(&self.0).get_ref().set_read_timeout(dur)
              }

              fn set_write_timeout(&self, dur: Option<Duration>) -> io::Result<()> {
                  lock(&self.0).get_ref().set_write_timeout(dur)
              }
          }

          /// A hyper `SslServer` implemented with OpenSSL.
          #[derive(Clone)]
          pub struct OpenSslServer(Arc<SslAcceptor>);

          impl OpenSslServer {
              /// Build from a PKCS#12 (.p12) file and its password - same signature
              /// and same semantics as the old `NativeTlsServer::new(path, password)`.
              ///
              /// The certificate, private key and any extra chain certificates (e.g.
              /// the CA) inside the bundle are all installed into the acceptor.
              pub fn new<P: AsRef<Path>>(path: P, password: &str) -> Result<OpenSslServer, ServerError> {
                  let mut buf = Vec::new();
                  File::open(path.as_ref())
                      .and_then(|mut f| f.read_to_end(&mut buf))
                      .map_err(ServerError::Io)?;

                  let pkcs12 = Pkcs12::from_der(&buf).map_err(ServerError::Tls)?;
                  let parsed = pkcs12.parse2(password).map_err(ServerError::Tls)?;
                  let cert = parsed
                      .cert
                      .ok_or(ServerError::BadBundle("no certificate found in PKCS#12 bundle"))?;
                  let pkey = parsed
                      .pkey
                      .ok_or(ServerError::BadBundle("no private key found in PKCS#12 bundle"))?;

                  let mut builder =
                      SslAcceptor::mozilla_intermediate_v5(SslMethod::tls()).map_err(ServerError::Tls)?;
                  builder.set_certificate(&cert).map_err(ServerError::Tls)?;
                  builder.set_private_key(&pkey).map_err(ServerError::Tls)?;
                  if let Some(ca) = parsed.ca.as_ref() {
                      for cert in ca.iter() {
                          builder
                              .add_extra_chain_cert(cert.to_owned())
                              .map_err(ServerError::Tls)?;
                      }
                  }
                  // TLS 1.2 as the floor: every current browser speaks it, and old
                  // TLS versions are removed from them anyway.
                  builder
                      .set_min_proto_version(Some(SslVersion::TLS1_2))
                      .map_err(ServerError::Tls)?;

                  Ok(OpenSslServer(Arc::new(builder.build())))
              }
          }

          impl<T> hyper::net::SslServer<T> for OpenSslServer
          where
              T: NetworkStream + Send + Clone + fmt::Debug + Sync,
          {
              type Stream = TlsStream<T>;

              fn wrap_server(&self, stream: T) -> hyper::Result<TlsStream<T>> {
                  match self.0.accept(stream) {
                      Ok(s) => Ok(TlsStream(Arc::new(Mutex::new(s)))),
                      Err(e) => {
                          // Old builds failed silently (clients saw a bare reset with
                          // nothing on the console); say *something* useful instead.
                          eprintln!("[tls] handshake failed: {}", e);
                          Err(hyper::Error::Ssl(Box::new(e)))
                      }
                  }
              }
          }

          /// An error while creating an `OpenSslServer`.
          #[derive(Debug)]
          pub enum ServerError {
              /// Error reading the .p12 file.
              Io(io::Error),
              /// Error parsing the bundle or building the TLS acceptor.
              Tls(openssl::error::ErrorStack),
              /// The .p12 parsed, but is missing the certificate or the key.
              BadBundle(&'static str),
          }

          impl fmt::Display for ServerError {
              fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
                  match *self {
                      ServerError::Io(ref e) => write!(f, "error reading identity: {}", e),
                      ServerError::Tls(ref e) => write!(f, "error initializing TLS acceptor: {}", e),
                      ServerError::BadBundle(what) => write!(f, "bad PKCS#12 bundle: {}", what),
                  }
              }
          }

          impl StdError for ServerError {
              fn source(&self) -> Option<&(dyn StdError + 'static)> {
                  match *self {
                      ServerError::Io(ref e) => Some(e),
                      ServerError::Tls(ref e) => Some(e),
                      ServerError::BadBundle(_) => None,
                  }
              }
          }
          EOF_TLS_RS
          cat > vendor/traitobject/Cargo.toml <<'EOF_TRAITOBJECT_TOML'
          [package]

          name = "traitobject"
          version = "0.1.0"
          authors = ["Jonathan Reem <jonathan.reem@gmail.com>"]
          repository = "https://github.com/reem/rust-traitobject.git"
          description = "Unsafe helpers for working with raw trait objects."
          readme = "README.md"
          license = "MIT/Apache-2.0"

          EOF_TRAITOBJECT_TOML
          cat > vendor/traitobject/src/lib.rs <<'EOF_TRAITOBJECT_LIB'
          #![cfg_attr(test, deny(warnings))]
          #![deny(missing_docs)]

          //! # traitobject
          //!
          //! Unsafe helpers for working with raw TraitObjects.

          use std::mem;

          /// Get the data pointer from this trait object.
          ///
          /// Highly unsafe, as there is no information about the type of the data.
          pub unsafe fn data<T: ?Sized>(val: *const T) -> *const () {
              *mem::transmute::<*const *const T, *const *const ()>(&val)
          }

          /// Get the data pointer from this trait object, mutably.
          ///
          /// Highly unsafe, as there is no information about the type of the data.
          pub unsafe fn data_mut<T: ?Sized>(mut val: *mut T) -> *mut () {
              *mem::transmute::<*mut *mut T, *mut *mut ()>(&mut val)
          }

          #[test]
          fn test_simple() {
              let x = &7 as &Send;
              unsafe { assert!(&7 == mem::transmute::<_, &i32>(data(x))) };
          }

          /// A trait implemented for all trait objects.
          ///
          /// Implementations for all traits in std are provided.
          pub unsafe trait Trait {}

          mod impls;

          EOF_TRAITOBJECT_LIB
          cat > vendor/traitobject/src/impls.rs <<'EOF_TRAITOBJECT_IMPLS'
          use Trait;

          unsafe impl Trait for ::std::any::Any + Send { }
          unsafe impl Trait for ::std::any::Any + Sync { }
          unsafe impl Trait for ::std::any::Any + Send + Sync { }
          unsafe impl<T: ?Sized> Trait for ::std::borrow::Borrow<T> + Send { }
          unsafe impl<T: ?Sized> Trait for ::std::borrow::Borrow<T> + Sync { }
          unsafe impl<T: ?Sized> Trait for ::std::borrow::Borrow<T> + Send + Sync { }
          unsafe impl<T: ?Sized> Trait for ::std::borrow::BorrowMut<T> + Send { }
          unsafe impl<T: ?Sized> Trait for ::std::borrow::BorrowMut<T> + Sync { }
          unsafe impl<T: ?Sized> Trait for ::std::borrow::BorrowMut<T> + Send + Sync { }
          unsafe impl<T: ?Sized> Trait for ::std::convert::AsMut<T> + Send { }
          unsafe impl<T: ?Sized> Trait for ::std::convert::AsMut<T> + Sync { }
          unsafe impl<T: ?Sized> Trait for ::std::convert::AsMut<T> + Send + Sync { }
          unsafe impl<T: ?Sized> Trait for ::std::convert::AsRef<T> + Send { }
          unsafe impl<T: ?Sized> Trait for ::std::convert::AsRef<T> + Sync { }
          unsafe impl<T: ?Sized> Trait for ::std::convert::AsRef<T> + Send + Sync { }
          unsafe impl Trait for ::std::error::Error + Send { }
          unsafe impl Trait for ::std::error::Error + Sync { }
          unsafe impl Trait for ::std::error::Error + Send + Sync { }
          unsafe impl Trait for ::std::fmt::Binary + Send { }
          unsafe impl Trait for ::std::fmt::Binary + Sync { }
          unsafe impl Trait for ::std::fmt::Binary + Send + Sync { }
          unsafe impl Trait for ::std::fmt::Debug + Send { }
          unsafe impl Trait for ::std::fmt::Debug + Sync { }
          unsafe impl Trait for ::std::fmt::Debug + Send + Sync { }
          unsafe impl Trait for ::std::fmt::Display + Send { }
          unsafe impl Trait for ::std::fmt::Display + Sync { }
          unsafe impl Trait for ::std::fmt::Display + Send + Sync { }
          unsafe impl Trait for ::std::fmt::LowerExp + Send { }
          unsafe impl Trait for ::std::fmt::LowerExp + Sync { }
          unsafe impl Trait for ::std::fmt::LowerExp + Send + Sync { }
          unsafe impl Trait for ::std::fmt::LowerHex + Send { }
          unsafe impl Trait for ::std::fmt::LowerHex + Sync { }
          unsafe impl Trait for ::std::fmt::LowerHex + Send + Sync { }
          unsafe impl Trait for ::std::fmt::Octal + Send { }
          unsafe impl Trait for ::std::fmt::Octal + Sync { }
          unsafe impl Trait for ::std::fmt::Octal + Send + Sync { }
          unsafe impl Trait for ::std::fmt::Pointer + Send { }
          unsafe impl Trait for ::std::fmt::Pointer + Sync { }
          unsafe impl Trait for ::std::fmt::Pointer + Send + Sync { }
          unsafe impl Trait for ::std::fmt::UpperExp + Send { }
          unsafe impl Trait for ::std::fmt::UpperExp + Sync { }
          unsafe impl Trait for ::std::fmt::UpperExp + Send + Sync { }
          unsafe impl Trait for ::std::fmt::UpperHex + Send { }
          unsafe impl Trait for ::std::fmt::UpperHex + Sync { }
          unsafe impl Trait for ::std::fmt::UpperHex + Send + Sync { }
          unsafe impl Trait for ::std::fmt::Write + Send { }
          unsafe impl Trait for ::std::fmt::Write + Sync { }
          unsafe impl Trait for ::std::fmt::Write + Send + Sync { }
          unsafe impl Trait for ::std::hash::Hasher + Send { }
          unsafe impl Trait for ::std::hash::Hasher + Sync { }
          unsafe impl Trait for ::std::hash::Hasher + Send + Sync { }
          unsafe impl Trait for ::std::io::BufRead + Send { }
          unsafe impl Trait for ::std::io::BufRead + Sync { }
          unsafe impl Trait for ::std::io::BufRead + Send + Sync { }
          unsafe impl Trait for ::std::io::Read + Send { }
          unsafe impl Trait for ::std::io::Read + Sync { }
          unsafe impl Trait for ::std::io::Read + Send + Sync { }
          unsafe impl Trait for ::std::io::Seek + Send { }
          unsafe impl Trait for ::std::io::Seek + Sync { }
          unsafe impl Trait for ::std::io::Seek + Send + Sync { }
          unsafe impl Trait for ::std::io::Write + Send { }
          unsafe impl Trait for ::std::io::Write + Sync { }
          unsafe impl Trait for ::std::io::Write + Send + Sync { }
          unsafe impl<T, I> Trait for ::std::iter::IntoIterator<IntoIter=I, Item=T> { }
          unsafe impl<T> Trait for ::std::iter::Iterator<Item=T> + Send { }
          unsafe impl<T> Trait for ::std::iter::Iterator<Item=T> + Sync { }
          unsafe impl<T> Trait for ::std::iter::Iterator<Item=T> + Send + Sync { }
          // Patched for modern rustc: `dyn Send + Send + Sync` etc. now normalize to
          // `dyn Send + Sync`, which made these six impls collapse into duplicates
          // (E0119). Keep exactly the three distinct trait-object types.
          unsafe impl Trait for ::std::marker::Send { }
          unsafe impl Trait for ::std::marker::Sync { }
          unsafe impl Trait for ::std::marker::Send + Sync { }
          unsafe impl Trait for ::std::ops::Drop + Send { }
          unsafe impl Trait for ::std::ops::Drop + Sync { }
          unsafe impl Trait for ::std::ops::Drop + Send + Sync { }
          unsafe impl Trait for ::std::string::ToString + Send { }
          unsafe impl Trait for ::std::string::ToString + Sync { }
          unsafe impl Trait for ::std::string::ToString + Send + Sync { }

          EOF_TRAITOBJECT_IMPLS
          cat > Cargo.lock <<'EOF_CARGO_LOCK'
