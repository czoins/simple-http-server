      - name: Build (with a full Perl on PATH for the vendored OpenSSL)
        shell: bash
        run: |
          # --- make a full Perl visible for the vendored OpenSSL build -------------
          # Git Bash's bundled Perl lacks core modules (Locale::Maketext::Simple etc.)
          # which makes openssl-src's `perl Configure` die with exit code 2.
          for d in /c/Strawberry/perl/bin /c/Strawberry /c/tools/perl/bin /c/Perl64/bin /c/Perl/bin; do
            if [ -x "$d/perl.exe" ] && "$d/perl.exe" -MLocale::Maketext::Simple -e 'exit 0' >/dev/null 2>&1; then
              echo "Using full Perl from: $d"
              export PATH="$d:$PATH"
              break
            fi
          done
          if ! perl -MLocale::Maketext::Simple -e 'print "ok\n"' >/dev/null 2>&1; then
            echo 'No usable Perl found on the image; installing Strawberry Perl via chocolatey...'
            choco install -y strawberryperl --no-progress
            export PATH="/c/Strawberry/perl/bin:$PATH"
          fi
          perl -MLocale::Maketext::Simple -e 'print "perl ready for vendored OpenSSL\n"' \
            || { echo '::error::no full Perl available - vendored OpenSSL cannot be configured'; exit 1; }
          # ---------------------------------------------------------------------------
          cargo build --release

      - name: Smoke test (serve HTTPS with a throwaway self-signed p12)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $p12 = Join-Path $env:RUNNER_TEMP 'smoke.p12'
          $cert = New-SelfSignedCertificate -Subject 'CN=localhost' -KeyExportPolicy Exportable -CertStoreLocation 'Cert:\CurrentUser\My' -NotAfter (Get-Date).AddDays(2)
          $pw = ConvertTo-SecureString 'test1234' -AsPlainText -Force
          Export-PfxCertificate -Cert $cert -FilePath $p12 -Password $pw | Out-Null
          $exe = Join-Path (Get-Location) 'target\release\simple-http-server.exe'
          $out = Join-Path $env:RUNNER_TEMP 'smoke-server.log'
          $p = Start-Process -FilePath $exe -ArgumentList @('--cert', $p12, '--certpass', 'test1234', '--ip', '127.0.0.1', '--port', '8444', '.') -PassThru -NoNewWindow -RedirectStandardOutput $out
          try {
            $code = ''
            for ($i = 0; $i -lt 10 -and $code -ne '200'; $i++) {
              Start-Sleep -Seconds 1
              $code = (& curl.exe -k -s -o NUL -w '%{http_code}' https://127.0.0.1:8444/ 2>$null)
            }
            Write-Host "HTTPS smoke test HTTP status: $code"
            if ($code -ne '200') {
              Write-Host '--- server output so far:'
              Get-Content $out -ErrorAction SilentlyContinue
              throw "smoke test failed (status $code)"
            }
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)" -ErrorAction SilentlyContinue
          }
          Write-Host 'Smoke test PASSED: the exe serves HTTPS.'

      - name: Write usage note
        shell: bash
        run: |
          cat > USAGE.txt <<'EOF_USAGE'
          simple-http-server v0.6.1 - OpenSSL TLS build (patched)
          =======================================================

          This is upstream v0.6.1 with one surgical change: the TLS layer was switched
          from the platform's native TLS (Schannel on Windows) to OpenSSL, statically
          linked into this exe. On machines where Schannel's server-side policy rejects
          what the original 2021-era binary could negotiate, the original exe resets
          every HTTPS connection; this build does not use Schannel at all.

          The command line is IDENTICAL to the original v0.6.1, e.g.:

              simple-http-server.exe --cert local.p12 --certpass <export-password> --ip 0.0.0.0 --port 8001 <root-dir>

          Notes:
          - --certpass takes the PKCS#12 EXPORT password (same as always).
          - TLS 1.2 and 1.3 (the old Windows binaries capped at TLS 1.2).
          - Failed handshakes now print a one-line reason on the console instead of
            resetting silently.
          - Downloaded exes may be flagged by SmartScreen (unsigned build): right-click
            -> Properties -> Unblock, or "More info" -> "Run anyway" when running.
          EOF_USAGE

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: simple-http-server-v0.6.1-openssl-windows-x64
          path: |
            target/release/simple-http-server.exe
            USAGE.txt
          if-no-files-found: error
